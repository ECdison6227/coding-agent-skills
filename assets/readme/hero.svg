<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="cas-title cas-desc">
  <title id="cas-title">Coding Agent Skills</title>
  <desc id="cas-desc">首屏展示三个 AI 编程 Skill 组成的工作流：dev-workflow 拆阶段、polish-loop-v2 做审查、ui-audit 做界面扫描。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="orange-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#fafaf9"/>

  <!-- Title -->
  <g transform="translate(64, 96)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#a8a29e" letter-spacing="0.1em">AI CODING GUARDRAILS</text>
    <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="54" font-weight="780" fill="#1c1917" letter-spacing="-0.03em">Coding Agent Skills</text>
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="430" fill="#57534e">让 Agent 写代码少一点“抽奖感”</text>
  </g>

  <!-- Pipeline cards -->
  <g transform="translate(620, 88)" filter="url(#shadow)">
    <!-- Card 1: dev-workflow -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="200" rx="18" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
      <rect x="0" y="0" width="160" height="6" rx="3" fill="url(#blue-grad)"/>
      <circle cx="80" cy="52" r="24" fill="#dbeafe"/>
      <text x="80" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#1d4ed8">P0→P5</text>
      <text x="80" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1c1917">dev-workflow</text>
      <text x="80" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#78716c">拆阶段</text>
      <rect x="20" y="140" width="120" height="8" rx="4" fill="#f5f5f4"/>
      <rect x="20" y="156" width="90" height="8" rx="4" fill="#f5f5f4"/>
      <rect x="20" y="172" width="110" height="8" rx="4" fill="#f5f5f4"/>
    </g>

    <!-- Arrow -->
    <g transform="translate(170, 90)">
      <line x1="0" y1="10" x2="30" y2="10" stroke="#d6d3d1" stroke-width="2" stroke-linecap="round"/>
      <path d="M24 4l6 6-6 6" stroke="#d6d3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Card 2: polish-loop-v2 -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="160" height="200" rx="18" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
      <rect x="0" y="0" width="160" height="6" rx="3" fill="url(#purple-grad)"/>
      <circle cx="80" cy="52" r="24" fill="#ede9fe"/>
      <text x="80" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#6d28d9">≤5</text>
      <text x="80" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1c1917">polish-loop-v2</text>
      <text x="80" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#78716c">精准审查</text>
      <rect x="20" y="140" width="120" height="8" rx="4" fill="#f5f5f4"/>
      <rect x="20" y="156" width="100" height="8" rx="4" fill="#f5f5f4"/>
      <rect x="20" y="172" width="80" height="8" rx="4" fill="#f5f5f4"/>
    </g>

    <!-- Arrow -->
    <g transform="translate(380, 90)">
      <line x1="0" y1="10" x2="30" y2="10" stroke="#d6d3d1" stroke-width="2" stroke-linecap="round"/>
      <path d="M24 4l6 6-6 6" stroke="#d6d3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Card 3: ui-audit -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="160" height="200" rx="18" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
      <rect x="0" y="0" width="160" height="6" rx="3" fill="url(#orange-grad)"/>
      <circle cx="80" cy="52" r="24" fill="#ffedd5"/>
      <text x="80" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#b45309">UI</text>
      <text x="80" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1c1917">ui-audit</text>
      <text x="80" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#78716c">界面扫描</text>
      <rect x="20" y="140" width="120" height="8" rx="4" fill="#f5f5f4"/>
      <rect x="20" y="156" width="90" height="8" rx="4" fill="#f5f5f4"/>
      <rect x="20" y="172" width="110" height="8" rx="4" fill="#f5f5f4"/>
    </g>

    <!-- Bottom tagline -->
    <text x="290" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#a8a29e">baseline → review → fix → regression</text>
  </g>
</svg>
