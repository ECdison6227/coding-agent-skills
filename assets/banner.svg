<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- grid dots -->
  <g fill="#30363d" opacity="0.5">
    <circle cx="80" cy="80" r="2"/>
    <circle cx="160" cy="80" r="2"/>
    <circle cx="240" cy="80" r="2"/>
    <circle cx="320" cy="80" r="2"/>
    <circle cx="80" cy="160" r="2"/>
    <circle cx="160" cy="160" r="2"/>
    <circle cx="240" cy="160" r="2"/>
    <circle cx="320" cy="160" r="2"/>
    <circle cx="80" cy="240" r="2"/>
    <circle cx="160" cy="240" r="2"/>
    <circle cx="240" cy="240" r="2"/>
    <circle cx="320" cy="240" r="2"/>
  </g>

  <!-- title -->
  <text x="640" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f0f6fc">EC 的编程 Skill</text>
  <text x="640" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">让 Agent 写代码不再像抽奖</text>

  <!-- connection lines -->
  <g stroke="#30363d" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 310 340 L 470 340"/>
    <path d="M 610 340 L 770 340"/>
    <path d="M 640 430 L 640 480"/>
  </g>

  <!-- arrows -->
  <g fill="#30363d">
    <polygon points="465,340 455,333 455,347"/>
    <polygon points="765,340 755,333 755,347"/>
    <polygon points="640,475 633,465 647,465"/>
  </g>

  <!-- skill nodes -->
  <g transform="translate(120, 290)">
    <rect width="180" height="100" rx="12" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="90" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#58a6ff">dev-workflow</text>
    <text x="90" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">流程协调</text>
  </g>

  <g transform="translate(480, 290)">
    <rect width="140" height="100" rx="12" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <text x="70" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#3fb950">polish-v2</text>
    <text x="70" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">代码审查</text>
  </g>

  <g transform="translate(780, 290)">
    <rect width="140" height="100" rx="12" fill="#21262d" stroke="#d29922" stroke-width="2"/>
    <text x="70" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#d29922">ui-audit</text>
    <text x="70" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">界面审查</text>
  </g>

  <!-- bottom node -->
  <g transform="translate(540, 480)">
    <rect width="200" height="70" rx="12" fill="#21262d" stroke="#f78166" stroke-width="2"/>
    <text x="100" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f78166">project-guardian</text>
    <text x="100" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">强制 Git 纪律（相关仓库）</text>
  </g>

  <!-- corner labels -->
  <text x="1220" y="610" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#484f58">for Trae / Claude Code / Codex</text>
</svg>