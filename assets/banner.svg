<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="#f9fafb"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- title -->
  <text x="640" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#111827">EC 的编程 Skill</text>
  <text x="640" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#6b7280">让 Agent 写代码少一点抽奖感</text>

  <!-- flowchart: start -->
  <g transform="translate(540, 170)" filter="url(#shadow)">
    <rect width="200" height="56" rx="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e40af">用户请求</text>
  </g>

  <!-- arrows: start -> skills -->
  <path d="M 610 226 Q 610 250 260 250 L 260 280" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <line x1="640" y1="226" x2="640" y2="280" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 670 226 Q 670 250 1020 250 L 1020 280" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- skill nodes -->
  <g transform="translate(140, 280)" filter="url(#shadow)">
    <rect width="240" height="110" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="6" rx="4" fill="#3b82f6"/>
    <text x="120" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">dev-workflow</text>
    <text x="120" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280">分阶段推进 · 防止上下文爆炸</text>
  </g>

  <g transform="translate(520, 280)" filter="url(#shadow)">
    <rect width="240" height="110" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="6" rx="4" fill="#10b981"/>
    <text x="120" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">polish-loop-v2</text>
    <text x="120" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280">最多 5 轮 · 只审变更文件</text>
  </g>

  <g transform="translate(900, 280)" filter="url(#shadow)">
    <rect width="240" height="110" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="6" rx="4" fill="#f59e0b"/>
    <text x="120" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">ui-audit</text>
    <text x="120" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280">扫描 UI 硬伤 · 状态缺失</text>
  </g>

  <!-- arrows: skills -> guardian -->
  <path d="M 260 390 Q 260 420 520 460" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <line x1="640" y1="390" x2="640" y2="440" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1020 390 Q 1020 420 760 460" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- bottom: project-guardian -->
  <g transform="translate(440, 460)" filter="url(#shadow)">
    <rect width="400" height="72" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="0" y="0" width="400" height="6" rx="4" fill="#ef4444"/>
    <text x="200" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">project-guardian · 强制 Git 纪律</text>
    <text x="200" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">自动 init / add / commit · 只在危险操作时确认</text>
  </g>

  <!-- bottom labels -->
  <text x="640" y="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9ca3af">for Trae / Claude Code / Codex</text>
</svg>
